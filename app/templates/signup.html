{% extends "base.html" %}

{% block title %}Signup{% endblock %}

{% block content %}

<div class="login-box">

    <h2>Signup</h2>

    <form method="POST">

        <div class="form-group">

            <label>Username</label>

            <input type="text"
                   name="username"
                   required>

        </div>

        <div class="form-group">

            <label>Password</label>

            <input type="password"
                   name="password"
                   required>

        </div>

        <button type="submit" class="btn">
            Signup
        </button>

    </form>

</div>

{% endblock %}
